  <style>
    /* ... keep all your existing styles ... */
    /* Only the scanner-result specific styles are updated below */
    
    .scan-result {
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--bg-card);
    }
    .result-header {
      background: var(--accent-glow);
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .result-content {
      padding: 12px;
      background: var(--bg-primary);
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result-actions {
      padding: 12px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      background: var(--bg-card);
    }
    .result-actions button {
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-cancel {
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .btn-save {
      background: var(--accent);
      color: white;
      border: none;
    }
    pre {
      margin: 0;
      font-family: 'Inter', monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    /* Ensure the scanner panel takes full width on mobile */
    .scanner-panel {
      margin: 16px;
    }
    .scanner-body {
      padding: 16px;
    }
    .file-drop-zone {
      padding: 20px;
    }
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .explorer-panel, .assistant-panel {
        width: 100%;
      }
    }
  </style>
