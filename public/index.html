<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicare Assistant – Document Q&A</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
        }
        .tab {
            flex: 1;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: 0.2s;
        }
        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }
        .tab-content {
            display: none;
            padding: 20px;
        }
        .tab-content.active {
            display: block;
        }
        /* Chat styles */
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user {
            align-self: flex-end;
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .ai {
            align-self: flex-start;
            background: #e2e8f0;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }
        .typing {
            align-self: flex-start;
            background: #e2e8f0;
            padding: 10px 14px;
            border-radius: 18px;
            font-style: italic;
            color: #475569;
        }
        .input-area {
            display: flex;
            gap: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 1rem;
        }
        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        /* Upload styles */
        .upload-area {
            text-align: center;
            padding: 20px;
        }
        .upload-area input {
            margin: 16px 0;
        }
        .upload-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            background: #f1f5f9;
            color: #334155;
        }
        .error {
            color: #dc2626;
            background: #fee2e2;
        }
        .success {
            color: #16a34a;
            background: #dcfce7;
        }
        h3 {
            margin-bottom: 12px;
            color: #1e293b;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="tabs">
        <div class="tab active" data-tab="chat">💬 Chat with AI</div>
        <div class="tab" data-tab="upload">📄 Scan Document</div>
    </div>

    <!-- Chat Tab -->
    <div id="chat-tab" class="tab-content active">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                👋 Hello! Upload your documents in the "Scan Document" tab, then ask me anything about them. I'll answer only from your documents.
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="Ask about your documents..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- Upload Tab -->
    <div id="upload-tab" class="tab-content">
        <div class="upload-area">
            <h3>📂 Upload a document (.txt recommended)</h3>
            <input type="file" id="docFile" accept=".txt,.pdf,.md">
            <br>
            <button id="uploadBtn">Scan Document</button>
            <div id="uploadStatus" class="status" style="display: none;"></div>
        </div>
    </div>
</div>

<script>
    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            contents.forEach(content => content.classList.remove('active'));
            document.getElementById(`${target}-tab`).classList.add('active');
        });
    });

    // ----- CHAT FUNCTIONALITY -----
    const chatMessages = document.getElementById('chatMessages');
    const questionInput = document.getElementById('questionInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, isUser) {
        const div = document.createElement('div');
        div.className = `message ${isUser ? 'user' : 'ai'}`;
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.id = 'typingIndicator';
        typingDiv.className = 'typing';
        typingDiv.textContent = 'AI is searching your documents...';
        chatMessages.appendChild(typingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendQuestion() {
        const message = questionInput.value.trim();
        if (!message) return;

        addMessage(message, true);
        questionInput.value = '';
        showTyping();

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            hideTyping();
            if (response.ok) {
                addMessage(data.reply, false);
            } else {
                addMessage('⚠️ Error: ' + (data.error || 'Something went wrong.'), false);
            }
        } catch (err) {
            hideTyping();
            addMessage('⚠️ Network error. Check your connection.', false);
        }
    }

    sendBtn.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendQuestion();
    });

    // ----- UPLOAD FUNCTIONALITY -----
    const docFile = document.getElementById('docFile');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadStatus = document.getElementById('uploadStatus');

    async function uploadDocument() {
        const file = docFile.files[0];
        if (!file) {
            showStatus('Please select a file first.', 'error');
            return;
        }

        const formData = new FormData();
        formData.append('document', file);

        showStatus('Uploading and scanning...', 'info');
        uploadBtn.disabled = true;

        try {
            const response = await fetch('/api/upload-document', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.success) {
                showStatus(`✅ ${data.message} (ID: ${data.id})`, 'success');
                docFile.value = ''; // clear selection
            } else {
                showStatus(`❌ Upload failed: ${data.error || 'Unknown error'}`, 'error');
            }
        } catch (err) {
            showStatus(`❌ Network error: ${err.message}`, 'error');
        } finally {
            uploadBtn.disabled = false;
        }
    }

    function showStatus(msg, type) {
        uploadStatus.textContent = msg;
        uploadStatus.style.display = 'block';
        uploadStatus.className = `status ${type === 'error' ? 'error' : (type === 'success' ? 'success' : '')}`;
        setTimeout(() => {
            if (uploadStatus.style.display !== 'none') {
                uploadStatus.style.display = 'none';
            }
        }, 4000);
    }

    uploadBtn.addEventListener('click', uploadDocument);
</script>
</body>
</html>
